# Tests and builds on every PR and push to main (#76). Uses only the example
# config files with fake values, no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The jobs only read the repo (#121)
permissions:
  contents: read

# Actions are pinned to commit SHAs (the comment is the tag); Dependabot updates them (#121)
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # The backend uses the machine's local time, like the server (Budapest); the
      # migration test (#65) relies on it
      TZ: Europe/Budapest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: pytest backend/tests -v

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sketch: [co2_node, eink_node, main_node]
    env:
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
      # Pinned to the versions the sketches were last built with (#121). Bump them on
      # purpose, together with a reflash test.
      - name: Install the ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls "$ESP32_INDEX"
          arduino-cli lib install "PubSubClient@2.8.0" "ArduinoJson@7.4.3" "ld2410@0.2.2" \
            "Adafruit BME280 Library@2.3.0" "MH-Z19@1.5.4" "GxEPD2@1.6.9"
      - name: Compile with the example secrets
        run: |
          cp firmware/secrets.example.h firmware/${{ matrix.sketch }}/secrets.h
          arduino-cli compile --fqbn esp32:esp32:esp32 --library firmware/libraries/HomePing firmware/${{ matrix.sketch }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the preview APK and run lint, with the example config
        working-directory: android
        run: |
          cp local.properties.example local.properties
          chmod +x gradlew
          ./gradlew assemblePreview lintPreview --console=plain
      - name: Upload the lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-preview.html
