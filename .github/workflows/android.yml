# Android preview APK and lint (#76). Uses only the example config files with fake values, no secrets.
# Runs only on PRs that touch these paths, and not again on the merge to main: a full run
# of all three workflows takes ~12 minutes (Actions minutes were capped while the repo was
# private; public repos don't use them up on standard runners). Run it by hand from the
# Actions tab with "Run workflow".
name: Android

on:
  pull_request:
    paths:
      - android/**
      - .github/workflows/android.yml
  workflow_dispatch:

# A new push to the PR cancels the run for the older commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repo (#121)
permissions:
  contents: read

# Actions are pinned to commit SHAs (the comment is the tag); Dependabot updates them (#121)
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the preview APK and run lint, with the example config
        working-directory: android
        run: |
          cp local.properties.example local.properties
          ./gradlew assemblePreview lintPreview --console=plain
      - name: Upload the lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-preview.html
