# Backend tests and lint (#76). Uses only the example config files with fake values, no secrets.
# Runs on PRs that touch these paths and again on the merge to main (#451): a full run of all
# three workflows takes ~12 minutes, which mattered while the repo was private; public repos
# don't use up Actions minutes on standard runners. By hand: the Actions tab, "Run workflow".
# Also nightly: some tests depend on the date or the time of day (#424, #450), and a test
# that starts failing on its own should show up here, not in the next unrelated PR.
name: Backend

on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/backend.yml
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC
  workflow_dispatch:

# A new push to the PR cancels the run for the older commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repo (#121)
permissions:
  contents: read

# Actions are pinned to commit SHAs (the comment is the tag); Dependabot updates them (#121)
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"   # the server's (Ubuntu 24.04)
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      # Unused imports, undefined names and the like (#175); rules in backend/ruff.toml
      - run: ruff check backend
      - run: pytest backend/tests -v
