# Backend tests and lint (#76). Uses only the example config files with fake values, no secrets.
# Runs only on PRs that touch these paths, and not again on the merge to main: the
# private repo has 2,000 Actions minutes a month, and a full run of all three
# workflows costs ~12. Run it by hand from the Actions tab with "Run workflow".
name: Backend

on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend.yml
  workflow_dispatch:

# A new push to the PR cancels the run for the older commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repo (#121)
permissions:
  contents: read

# Actions are pinned to commit SHAs (the comment is the tag); Dependabot updates them (#121)
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # The backend uses the machine's local time, like the server (Budapest); the
      # migration test (#65) relies on it
      TZ: Europe/Budapest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      # Unused imports, undefined names and the like (#175); rules in backend/ruff.toml
      - run: ruff check backend
      - run: pytest backend/tests -v
