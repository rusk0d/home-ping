# Firmware compile and the HomePing library test (#76). Uses only the example config files with fake values, no secrets.
# Runs only on PRs that touch these paths, and not again on the merge to main: the
# private repo has 2,000 Actions minutes a month, and a full run of all three
# workflows costs ~12. Run it by hand from the Actions tab with "Run workflow".
name: Firmware

on:
  pull_request:
    paths:
      - firmware/**
      - .github/workflows/firmware.yml
  workflow_dispatch:

# A new push to the PR cancels the run for the older commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repo (#121)
permissions:
  contents: read

# Actions are pinned to commit SHAs (the comment is the tag); Dependabot updates them (#121)
jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sketch: [eink_node, main_node]
    env:
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
      # Pinned to the versions the sketches were last built with (#121). Bump them on
      # purpose, together with a reflash test.
      - name: Install the ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls "$ESP32_INDEX"
          arduino-cli lib install "PubSubClient@2.8.0" "ArduinoJson@7.4.3" "ld2410@0.2.2" \
            "Adafruit BME280 Library@2.3.0" "MH-Z19@1.5.4" "GxEPD2@1.6.9"
      - name: Compile with the example secrets
        run: |
          cp firmware/secrets.example.h firmware/${{ matrix.sketch }}/secrets.h
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs --library firmware/libraries/HomePing firmware/${{ matrix.sketch }}

  # Host-side unit test of the shared firmware library against fake Arduino headers (#120)
  firmware-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run the HomePing test
        working-directory: firmware/libraries/HomePing/test
        run: |
          g++ -std=c++17 -Wall -Wextra -I fakes -I ../src -o test_homeping test_homeping.cpp
          ./test_homeping
