# Weekly dependency updates (#121). Minor and patch updates come as one grouped PR
# per ecosystem, so they stay reviewable and usually just merge. Major versions are
# left out of the groups and come as one PR each, since they can need code changes
# (e.g. Android Gradle Plugin 9, see #141/#125). CI runs on each PR. The Arduino core
# and libraries aren't covered by Dependabot; they are pinned in .github/workflows/firmware.yml.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
