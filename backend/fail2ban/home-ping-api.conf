# fail2ban filter (#61): failed logins (401) on the backend's REST API, from
# nginx's access log (default "combined" format). Install: README "API brute-force
# protection".
# fail2ban cuts the matched timestamp out of the line first, so the brackets
# are usually empty here: [^\]]* not [^\]]+.
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Z]+ /api/[^" ]* HTTP/[0-9.]+" 401 
ignoreregex =
