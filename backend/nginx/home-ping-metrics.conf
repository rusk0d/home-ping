# Prometheus scrape endpoint for the home server, reachable over Tailscale only.
# Install: copy to /etc/nginx/sites-available/, link it into sites-enabled, then
# `sudo nginx -t && sudo systemctl reload nginx`, and open the port on the Tailscale
# interface only: `sudo ufw allow in on tailscale0 to any port 9105 proto tcp`.
# The backend also checks METRICS_TOKEN (.env), so a wrong scraper config gets a 401.
server {
    listen 9105;
    server_name _;

    # Tailscale's address range; the ufw rule above already keeps the public side out
    allow 100.64.0.0/10;
    deny all;

    # Own log: the fail2ban API jail reads access.log, and a misconfigured scraper's
    # 401s every 30 s would ban the home server
    access_log /var/log/nginx/home-ping-metrics.log;

    location = /metrics {
        proxy_pass http://127.0.0.1:5000/api/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
