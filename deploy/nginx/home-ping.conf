# /etc/nginx/sites-available/<your domain>: the parts of the site that belong to Home Ping.
# example.org stands for the real host name. certbot adds the `listen 443 ssl` lines, the
# certificate paths and the port 80 redirect server ("managed by Certbot") on its first run.
server {
    server_name example.org www.example.org;

    root /var/www/example.org;                  # web/ from the repo, plus config.js
    include snippets/home-ping-headers.conf;    # web/nginx/security-headers.conf (CSP, HSTS)
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The web page's MQTT connection: WebSockets to Mosquitto's localhost listener. Every
    # login attempt is one new connection, so the limit caps password guessing (#459);
    # the zone is in home-ping-limits.conf.
    location /mqtt {
        limit_req zone=mqtt burst=10 nodelay;
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;                  # an open dashboard stays connected
    }

    # The backend (waitress on 127.0.0.1:5000). Wrong logins end up as 401 in the access
    # log, which backend/fail2ban/ watches (#61).
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
