# /etc/mosquitto/mosquitto.conf (Mosquitto 2.0.18, Ubuntu 24.04). The copy of what runs on
# the server; contracts/mqtt.md "Broker accounts" explains the accounts and listeners.
per_listener_settings true

# Plain MQTT, localhost only: the backend
listener 1883 127.0.0.1
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# WebSockets, localhost only: nginx /mqtt is its only client (the web page)
listener 9001 127.0.0.1
protocol websockets
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

include_dir /etc/mosquitto/conf.d

# MQTT over TLS, public: the nodes (#31). Its own password file with only `sensor` (#459),
# so the other accounts can't be tried from the internet here. The certificate files are
# copied in by deploy/certbot/mosquitto.sh on every renewal.
listener 8883
allow_anonymous false
password_file /etc/mosquitto/passwd-nodes
acl_file /etc/mosquitto/acl
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
