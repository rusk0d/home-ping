# Security headers for the Home Ping web page (#168). Include it in the site's
# `server { ... }` block (the HTTPS one):   include snippets/home-ping-headers.conf;
# BROKER_HOST is the host of MQTT_CONFIG.url in web/config.js; the install command in the
# README fills it in. The page can be opened with or without "www", but it always
# connects to that one host, so 'self' alone isn't enough for connect-src.
#
# nginx only inherits add_header into a location that has no add_header of its own, so
# keep these at server level and don't add headers inside the locations.

server_tokens off;   # "Server: nginx" without the version

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# script-src: app.js, config.js and mqtt.js (pinned with SRI) only, no inline scripts.
# style-src needs 'unsafe-inline': the page has a <style> block and style attributes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; connect-src 'self' wss://BROKER_HOST; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
